overview: "Real per-movie 'Because You Watched' rows built from your own library."
category: "General"
description: >
  Jellyfin's built-in "Because you watched" suggestion returns the same
  near-alphabetical slice of your library for every title. This plugin replaces it
  with real per-movie home screen rows: one row per recent watch, named after that
  movie, filled with genuinely similar titles from your library. A four-signal
  scoring engine ranks candidates by shared subcategory tags (rarity-weighted),
  genres, shared directors and writers, and era, with a tone gate that blocks
  tag-only false matches and a filter for meaningless mood tags. Watched titles are
  hidden, rows follow your history automatically, and thin rows are backfilled with
  well-rated same-genre picks. Rows render through the Home Screen Sections plugin;
  a standalone per-user playlist mode works with no other plugins installed.
artifacts:
  - "Jellyfin.Plugin.BecauseYouWatched.dll"
changelog: >
