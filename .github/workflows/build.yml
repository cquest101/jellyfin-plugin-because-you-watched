name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PLUGIN_NAME: Because You Watched
  DLL_NAME: Jellyfin.Plugin.BecauseYouWatched.dll
  GUID: 6c784ca1-2a6f-4132-af78-405582869670
  TARGET_ABI: 10.11.0.0
  VERSION: 1.1.5.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.BecauseYouWatched/Jellyfin.Plugin.BecauseYouWatched.csproj

      - name: Build (Release)
        run: dotnet build Jellyfin.Plugin.BecauseYouWatched/Jellyfin.Plugin.BecauseYouWatched.csproj -c Release --no-restore

      - name: Package plugin zip
        id: package
        run: |
          set -euo pipefail
          OUT=$(find Jellyfin.Plugin.BecauseYouWatched/bin/Release -name "$DLL_NAME" | head -1)
          echo "Built: $OUT"
          mkdir -p artifact
          cp "$OUT" artifact/
          TS=$(date -u +%Y-%m-%dT%H:%M:%S.0000000Z)
          cat > artifact/meta.json <<EOF
          {
            "category": "General",
            "changelog": "See https://github.com/cquest101/jellyfin-plugin-because-you-watched/releases",
            "description": "Real per-movie 'Because You Watched' home rows: one row per recent watch, filled with genuinely similar titles from your own library, ranked by a four-signal scoring engine (tags, genres, people, era).",
            "guid": "${GUID}",
            "name": "${PLUGIN_NAME}",
            "overview": "Real per-movie 'Because You Watched' rows built from your own library.",
            "owner": "cquest101",
            "targetAbi": "${TARGET_ABI}",
            "timestamp": "${TS}",
            "version": "${VERSION}"
          }
          EOF
          ZIP="because-you-watched_${VERSION}.zip"
          (cd artifact && zip -r "../${ZIP}" .)
          MD5=$(md5sum "${ZIP}" | cut -d' ' -f1)
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "md5=${MD5}" >> "$GITHUB_OUTPUT"
          echo "Checksum (md5): ${MD5}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: because-you-watched
          path: ${{ steps.package.outputs.zip }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip }}
          body: |
            Plugin zip checksum (md5): `${{ steps.package.outputs.md5 }}`

            Add the repository manifest in Jellyfin, or install this zip manually.

      - name: Update repository manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.package.outputs.zip }}"
          MD5="${{ steps.package.outputs.md5 }}"
          TS=$(date -u +%Y-%m-%dT%H:%M:%S.0000000Z)
          python3 - "$URL" "$MD5" "$TS" "$VERSION" <<'PY'
          import json, sys
          url, md5, ts, ver = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          d = json.load(open('manifest.json'))
          d[0]['versions'][0].update(version=ver, sourceUrl=url, checksum=md5, timestamp=ts)
          json.dump(d, open('manifest.json', 'w'), indent=4)
          PY
          git add manifest.json
          git commit -m "ci: update manifest for ${{ github.ref_name }}" || { echo "no manifest change"; exit 0; }
          git push origin main
